<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">
    Auditable Constraint Architecture for Agentic AI in OT Environments
  </text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#555">
    Mediation layer between LLM agent and simulated OT actuation (microgrid/BEMS testbed)
  </text>

  <!-- Agent -->
  <rect x="40" y="110" width="160" height="80" rx="8" fill="#e8f0fe" stroke="#4a72b8" stroke-width="2"/>
  <text x="120" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">LLM Agent</text>
  <text x="120" y="165" text-anchor="middle" font-size="11" fill="#444">(tool-calling,</text>
  <text x="120" y="179" text-anchor="middle" font-size="11" fill="#444">proposes action)</text>

  <!-- Component 1: Action-Space Bounding -->
  <rect x="270" y="90" width="200" height="120" rx="8" fill="#fef6e0" stroke="#c9962a" stroke-width="2"/>
  <text x="370" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. Action-Space</text>
  <text x="370" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Bounding Engine</text>
  <text x="370" y="153" text-anchor="middle" font-size="10.5" fill="#444">Range / rate-of-change /</text>
  <text x="370" y="167" text-anchor="middle" font-size="10.5" fill="#444">zone-permission DSL +</text>
  <text x="370" y="181" text-anchor="middle" font-size="10.5" fill="#444">consequence check</text>
  <text x="370" y="199" text-anchor="middle" font-size="10" fill="#a05a00" font-style="italic">no_action always permitted</text>

  <!-- Component 3: Override Gate -->
  <rect x="530" y="90" width="200" height="120" rx="8" fill="#fde8ec" stroke="#c94f68" stroke-width="2"/>
  <text x="630" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">3. Override Gate</text>
  <text x="630" y="136" text-anchor="middle" font-size="10.5" fill="#444">Risk-tier routing:</text>
  <text x="630" y="152" text-anchor="middle" font-size="10.5" fill="#444">HIGH = sync approval</text>
  <text x="630" y="168" text-anchor="middle" font-size="10.5" fill="#444">LOW = async review</text>
  <text x="630" y="188" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a1f36">Deny-by-default on timeout</text>

  <!-- Actuator -->
  <rect x="790" y="110" width="170" height="80" rx="8" fill="#e6f4ea" stroke="#3d8a52" stroke-width="2"/>
  <text x="875" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Simulated</text>
  <text x="875" y="163" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Actuation</text>
  <text x="875" y="180" text-anchor="middle" font-size="10.5" fill="#444">(microgrid/BEMS)</text>

  <!-- Main flow arrows -->
  <line x1="200" y1="150" x2="266" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="150" x2="526" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="150" x2="786" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="233" y="140" text-anchor="middle" font-size="9.5" fill="#666">proposed</text>
  <text x="233" y="151" text-anchor="middle" font-size="9.5" fill="#666">action</text>
  <text x="498" y="140" text-anchor="middle" font-size="9.5" fill="#666">validated</text>
  <text x="498" y="151" text-anchor="middle" font-size="9.5" fill="#666">action</text>
  <text x="758" y="140" text-anchor="middle" font-size="9.5" fill="#666">approved</text>
  <text x="758" y="151" text-anchor="middle" font-size="9.5" fill="#666">action</text>

  <!-- Reprompt loop back to agent -->
  <path d="M 370 90 C 370 72, 160 72, 120 106" fill="none" stroke="#c9962a" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="245" y="68" text-anchor="middle" font-size="10" fill="#a05a00">rejected -&gt; re-prompt (budget-limited)</text>

  <!-- Component 2: Decision Logging -->
  <rect x="270" y="290" width="200" height="110" rx="8" fill="#eef0fb" stroke="#5c56b0" stroke-width="2"/>
  <text x="370" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">2. Decision Logging</text>
  <text x="370" y="336" text-anchor="middle" font-size="10.5" fill="#444">Reasoning trace captured</text>
  <text x="370" y="351" text-anchor="middle" font-size="10.5" fill="#444">at proposal time</text>
  <text x="370" y="371" text-anchor="middle" font-size="10.5" fill="#444">(every disposition logged:</text>
  <text x="370" y="386" text-anchor="middle" font-size="10.5" fill="#444">approved/rejected/denied)</text>

  <!-- Component 4: Audit Trail -->
  <rect x="530" y="290" width="200" height="110" rx="8" fill="#eef0fb" stroke="#5c56b0" stroke-width="2"/>
  <text x="630" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">4. Audit Trail</text>
  <text x="630" y="336" text-anchor="middle" font-size="10.5" fill="#444">Hash-chained,</text>
  <text x="630" y="351" text-anchor="middle" font-size="10.5" fill="#444">append-only log</text>
  <text x="630" y="371" text-anchor="middle" font-size="10.5" fill="#444">Tamper-evident;</text>
  <text x="630" y="386" text-anchor="middle" font-size="10.5" fill="#444">independently verifiable</text>

  <!-- Logging arrows from components 1 and 3 down into 2/4 -->
  <line x1="370" y1="210" x2="370" y2="286" stroke="#5c56b0" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="630" y1="210" x2="630" y2="286" stroke="#5c56b0" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="470" y1="345" x2="526" y2="345" stroke="#5c56b0" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40" y="450" width="920" height="140" rx="6" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="60" y="475" font-size="12" font-weight="bold" fill="#1a1a1a">Key properties (empirically validated, 10 scenarios, real LLM agent):</text>
  <text x="60" y="498" font-size="11" fill="#333">- Deny-by-default-on-timeout: an unanswered high-tier override request is always denied, never allowed through</text>
  <text x="60" y="518" font-size="11" fill="#333">- Consequence check catches individually in-bounds actions with unsafe cumulative effect (e.g. reserve breach within 60 min)</text>
  <text x="60" y="538" font-size="11" fill="#333">- Tamper-evident log: modifying any entry's content or chain link is independently detectable</text>
  <text x="60" y="558" font-size="11" fill="#333">- no_action option: agent can legitimately decline when no safe action exists, avoiding forced malformed output</text>
  <text x="60" y="578" font-size="11" fill="#333">- Scope: supervisory/dispatch and maintenance/scheduling-tier actions only; protection-tier (ms-scale) control explicitly out of scope</text>
</svg>
