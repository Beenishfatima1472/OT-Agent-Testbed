<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="700" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Override Gate: Decision Flow</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#555">Component 3 -- risk-tier classification and human-review routing</text>

  <!-- Start: action passes DSL -->
  <rect x="330" y="85" width="240" height="55" rx="8" fill="#fef6e0" stroke="#c9962a" stroke-width="2"/>
  <text x="450" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Action passed DSL validation</text>

  <line x1="450" y1="140" x2="450" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Classify risk tier diamond -->
  <polygon points="450,180 560,240 450,300 340,240" fill="#eef0fb" stroke="#5c56b0" stroke-width="2"/>
  <text x="450" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Classify</text>
  <text x="450" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">risk tier</text>

  <text x="590" y="200" font-size="10.5" fill="#666" font-style="italic">unclassified action_type</text>
  <text x="590" y="214" font-size="10.5" fill="#666" font-style="italic">fails closed -&gt; HIGH</text>

  <!-- LOW branch -->
  <line x1="365" y1="270" x2="230" y2="360" stroke="#3d8a52" stroke-width="2" marker-end="url(#arr)"/>
  <text x="270" y="310" font-size="12" font-weight="bold" fill="#3d8a52">LOW tier</text>

  <rect x="100" y="365" width="270" height="70" rx="8" fill="#e6f4ea" stroke="#3d8a52" stroke-width="2"/>
  <text x="235" y="392" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">Async: execute immediately</text>
  <text x="235" y="410" text-anchor="middle" font-size="11" fill="#444">Logged as auto_approved_async</text>
  <text x="235" y="425" text-anchor="middle" font-size="10" fill="#666">for later human review</text>

  <text x="70" y="460" font-size="10" fill="#666" text-anchor="middle">e.g. charge rate,</text>
  <text x="70" y="474" font-size="10" fill="#666" text-anchor="middle">restore_load,</text>
  <text x="70" y="488" font-size="10" fill="#666" text-anchor="middle">SoH diagnostic,</text>
  <text x="70" y="502" font-size="10" fill="#666" text-anchor="middle">DR schedule,</text>
  <text x="70" y="516" font-size="10" fill="#666" text-anchor="middle">no_action</text>

  <!-- HIGH branch -->
  <line x1="535" y1="270" x2="670" y2="360" stroke="#c94f68" stroke-width="2" marker-end="url(#arr)"/>
  <text x="630" y="310" font-size="12" font-weight="bold" fill="#c94f68">HIGH tier</text>

  <rect x="530" y="365" width="270" height="70" rx="8" fill="#fde8ec" stroke="#c94f68" stroke-width="2"/>
  <text x="665" y="392" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">Sync: request human approval</text>
  <text x="665" y="410" text-anchor="middle" font-size="11" fill="#444">Blocks execution pending response</text>
  <text x="665" y="425" text-anchor="middle" font-size="10" fill="#666">within scenario latency budget</text>

  <text x="800" y="460" font-size="10" fill="#666" text-anchor="middle">e.g. discharge</text>
  <text x="800" y="474" font-size="10" fill="#666" text-anchor="middle">rate, load shed,</text>
  <text x="800" y="488" font-size="10" fill="#666" text-anchor="middle">supply switch</text>

  <line x1="665" y1="435" x2="665" y2="475" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Human responded? diamond -->
  <polygon points="665,480 775,535 665,590 555,535" fill="#eef0fb" stroke="#5c56b0" stroke-width="2"/>
  <text x="665" y="530" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">Response</text>
  <text x="665" y="548" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a">within budget?</text>

  <!-- yes -> approved/denied -->
  <line x1="600" y1="565" x2="470" y2="625" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="600" font-size="11" fill="#333">yes</text>
  <rect x="330" y="625" width="220" height="55" rx="8" fill="#f5f5f5" stroke="#888" stroke-width="2"/>
  <text x="440" y="650" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">overridden_approved</text>
  <text x="440" y="667" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">or overridden_denied</text>

  <!-- no -> timed_out_denied (the key property) -->
  <line x1="730" y1="565" x2="800" y2="625" stroke="#8a1f36" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="795" y="600" font-size="11" font-weight="bold" fill="#8a1f36">no (timeout)</text>
  <rect x="700" y="625" width="180" height="55" rx="8" fill="#fde8ec" stroke="#8a1f36" stroke-width="2.5"/>
  <text x="790" y="650" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a1f36">timed_out_denied</text>
  <text x="790" y="667" text-anchor="middle" font-size="9.5" fill="#8a1f36">never allowed through</text>

</svg>
